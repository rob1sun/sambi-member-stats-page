<!DOCTYPE html>

<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Sambi 2.0 - Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-purple: #c084fc;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 40px 24px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }

    /* Grid-system för statistik */
    .stats-container { margin-bottom: 40px; }
    .grid-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 24px; }
    .grid-sub { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }

    .stat-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    /* De stora boxarna */
    .stat-card.main { padding: 32px 24px; }
    .stat-card.main svg { width: 32px; height: 32px; color: var(--text-muted); margin-bottom: 16px; }
    .stat-card.main .val { font-size: 48px; font-weight: 700; margin: 0; line-height: 1; margin-bottom: 8px; }
    .stat-card.main h3 { margin: 0; font-size: 15px; color: var(--text-muted); font-weight: 500; }

    /* De små boxarna */
    .stat-card.sub { padding: 16px; }
    .stat-card.sub .val { font-size: 24px; font-weight: 700; margin: 0 0 4px 0; line-height: 1; }
    .stat-card.sub h3 { margin: 0; font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;}

    /* Kontroller och Filtrering */
    .controls-wrapper {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .controls { display: flex; flex-wrap: wrap; gap: 20px; }

    .control-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 180px; }
    .control-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}

    input, select {
      background: var(--bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent-blue); }

    /* Tabell-sektion */
    .table-header-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
    }
    .table-header-bar h2 { margin: 0; font-size: 20px; font-weight: 600; }
    .counter-display { font-size: 14px; color: var(--text-muted); font-weight: 500; }

    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 16px 24px; border-bottom: 1px solid var(--border); }
    th { background: rgba(15, 23, 42, 0.4); color: var(--text-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    tbody tr { transition: background-color 0.15s; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }
    tbody tr:last-child td { border-bottom: none; }

    .org-name { font-weight: 600; font-size: 15px; }

    /* Badges */
    .badges-container { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* Outline-badges för Anslutningsform */
    .badge.role-anv { border: 1px solid var(--accent-blue); color: var(--accent-blue); }
    .badge.role-anv-beg { border: 1px solid var(--accent-purple); color: var(--accent-purple); }
    .badge.role-tj { border: 1px solid var(--accent-green); color: var(--accent-green); }

    /* Solida, dova badges för Juridisk form */
    .badge.form { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }

  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Sambi 2.0 - Dashboard</h1>
    <div id="last-updated" style="font-size: 12px; color: var(--text-muted);"></div>
  </div>

  <div id="stats-container" class="stats-container">
    <div style="text-align: center; color: var(--text-muted); padding: 40px;">Laddar statistik...</div>
  </div>

  <div class="controls-wrapper" id="controls-container" style="display: none;"></div>

  <div class="table-header-bar" id="table-header" style="display: none;">
    <h2>Organisationer</h2>
    <div class="counter-display" id="counter-display">Laddar...</div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Namn</th>
          <th>Juridisk form</th>
          <th>Anslutningsform</th>
          <th>Plats (Län / Kommun)</th>
        </tr>
      </thead>
      <tbody id="org-list">
        <tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 40px;">Laddar data från API...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // Version: 20260420_1942
  // ==========================================
  // BYT UT MOT DIN CLOUDFLARE WORKER URL
  // ==========================================
  const API_BASE_URL = "https://sambi-json-for-web-stats.rob1sun9764.workers.dev";

  let allOrgs = [];
  let searchDebounceTimer;

  // Översättningslexikon för snyggare presentation i tabellen
  const labels = {
    anvandarorganisation: "Användarorg",
    anvandarorganisation_begransad: "Användarorg (begränsad)",
    tj: "Tjänsteleverantör",
    statliga_myndigheter: "Statlig myndighet",
    regioner: "Region",
    kommuner: "Kommun",
    ovriga_former: "Övriga former"
  };

  // Mappar interna ID:n till rätt färg-klass för badgarna
  const roleClasses = {
    anvandarorganisation: "role-anv",
    anvandarorganisation_begransad: "role-anv-beg",
    tj: "role-tj"
  };

  // Ikoner (SVG) för de tre stora korten
  const icons = {
    anslutna: `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>`,
    anvandarorg: `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`,
    tjanster: `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>`
  };

  async function init() {
    try {
      const [sRes, oRes] = await Promise.all([
        fetch(`${API_BASE_URL}/api/statistik`),
        fetch(`${API_BASE_URL}/api/organisationer`)
      ]);

      if (!sRes.ok || !oRes.ok) throw new Error("Kunde inte hämta data från API:et.");

      const stats = await sRes.json();
      const orgsData = await oRes.json();

      if(stats.senast_uppdaterad) {
        document.getElementById('last-updated').textContent = "Senast uppdaterad: " + new Date(stats.senast_uppdaterad).toLocaleString('sv-SE');
      }

      renderStats(stats);
      allOrgs = orgsData.organisationer;
      renderFilters(orgsData.metadata.filter);

      document.getElementById('controls-container').style.display = 'flex';
      document.getElementById('table-header').style.display = 'flex';

      update();
    } catch (e) {
      console.error("[Sambi Dashboard] API Fetch misslyckades:", e);
      document.getElementById('stats-container').innerHTML = `<p style="color:#ef4444; padding:24px;">Ett fel uppstod: ${e.message}<br><br>Har du satt in rätt API_BASE_URL i koden?</p>`;
      document.getElementById('org-list').innerHTML = `<tr><td colspan="4" style="color:#ef4444;">Ett fel uppstod vid inläsning av data.</td></tr>`;
    }
  }

  function renderStats(d) {
    document.getElementById('stats-container').innerHTML = `
      <div class="grid-top">
        <div class="stat-card main">
          ${icons.anslutna}
          <p class="val">${d.huvudmatrik.anslutna_organisationer}</p>
          <h3>Anslutna organisationer</h3>
        </div>
        <div class="stat-card main">
          ${icons.anvandarorg}
          <p class="val">${d.huvudmatrik.anvandarorganisationer}</p>
          <h3>Användarorganisationer</h3>
        </div>
        <div class="stat-card main">
          ${icons.tjanster}
          <p class="val">${d.huvudmatrik.tjansteleverantorer}</p>
          <h3>Tjänsteleverantörer</h3>
        </div>
      </div>
      <div class="grid-sub">
        <div class="stat-card sub"><p class="val">${d.juridisk_form.statliga_myndigheter}</p><h3>Statliga</h3></div>
        <div class="stat-card sub"><p class="val">${d.juridisk_form.regioner}</p><h3>Regioner</h3></div>
        <div class="stat-card sub"><p class="val">${d.juridisk_form.kommuner}</p><h3>Kommuner</h3></div>
        <div class="stat-card sub"><p class="val">${d.juridisk_form.enskild_naringsverksamhet}</p><h3>Enskilda</h3></div>
        <div class="stat-card sub"><p class="val">${d.juridisk_form.ovriga_former}</p><h3>Övriga</h3></div>
      </div>
    `;
  }

  function handleSearchInput() {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
      update();
    }, 250);
  }

  function renderFilters(filters) {
    let html = `
      <div class="controls">
        <div class="control-group">
          <label>Fritextsök</label>
          <input type="text" id="search" placeholder="Sök på namn..." oninput="handleSearchInput()">
        </div>
    `;

    filters.forEach(f => {
      html += `
        <div class="control-group">
          <label>${f.etikett}</label>
          <select id="f-${f.id}" onchange="update()">
            <option value="">Alla</option>
            ${f.alternativ.map(o=>`<option value="${o.id}">${o.label}</option>`).join('')}
          </select>
        </div>
      `;
    });

    html += `</div>`;
    document.getElementById('controls-container').innerHTML = html;
  }

  function update() {
    const s = document.getElementById('search').value.toLowerCase();
    const fAns = document.getElementById('f-anslutningsform').value;
    const fJur = document.getElementById('f-juridisk_form').value;
    const fLan = document.getElementById('f-lan').value;
    const fKom = document.getElementById('f-kommun').value;

    const filtered = allOrgs.filter(o => {
      if (o.orgnr) {
        const orgnrStr = String(o.orgnr);
        if ((orgnrStr.length === 10 && (orgnrStr[2] === '0' || orgnrStr[2] === '1')) ||
            (orgnrStr.length === 12 && (orgnrStr[4] === '0' || orgnrStr[4] === '1'))) {
          console.warn("Blockerade rendering av misstänkt personnummer i frontend:", o.orgnr);
          return false;
        }
      }

      return o.namn.toLowerCase().includes(s) &&
             (!fAns || o.anslutningsform.includes(fAns)) &&
             (!fJur || o.juridisk_form === fJur) &&
             (!fLan || o.lan === fLan) &&
             (!fKom || o.kommun === fKom);
    });

    document.getElementById('counter-display').textContent = `${filtered.length} organisationer visas`;
    renderTable(filtered);
  }

  function renderTable(data) {
    if(data.length === 0) {
      document.getElementById('org-list').innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 40px;">Inga organisationer matchade dina filter.</td></tr>`;
      return;
    }

    document.getElementById('org-list').innerHTML = data.map(o => {
      // Bygg Anslutningsforms-badgar (med färg)
      const roleBadges = o.anslutningsform.map(r => {
        const className = roleClasses[r] || "role-anv";
        const labelText = labels[r] || r;
        return `<span class="badge ${className}">${labelText}</span>`;
      }).join('');

      // Bygg Juridisk form-badge (grå/diskret)
      const formBadge = `<span class="badge form">${labels[o.juridisk_form] || o.juridisk_form}</span>`;

      // Bygg plats-sträng
      const platsText = o.lan ? `${o.lan} ${o.kommun ? '/ ' + o.kommun : ''}` : '<span style="color:var(--text-muted)">-</span>';

      return `
        <tr>
          <td class="org-name">${o.namn}</td>
          <td>${formBadge}</td>
          <td><div class="badges-container">${roleBadges}</div></td>
          <td style="font-size: 14px;">${platsText}</td>
        </tr>
      `;
    }).join('');
  }

  // Kör igång när API-URL är insatt
  if(API_BASE_URL !== "https://BYT_UT_MOT_DIN_WORKER_URL") {
    init();
  }
</script>
</body>
</html>
